[project]
name = "pwmanager"
version = "0.1.0"
description = "Secure command-line password manager (ICS0022)"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
